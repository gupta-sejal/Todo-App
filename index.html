<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>やること — To Do</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background-color: #f5f0e8;
      background-image:
        linear-gradient(rgba(180,190,160,0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(180,190,160,0.18) 1px, transparent 1px);
      background-size: 36px 36px;
      font-family: 'Inter', sans-serif;
      padding: 48px 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Floating cute deco elements */
    .deco {
      position: fixed;
      pointer-events: none;
      user-select: none;
      font-size: 22px;
      opacity: 0.18;
      animation: float 6s ease-in-out infinite;
    }
    .deco:nth-child(1)  { top: 6%;  left: 3%;   animation-delay: 0s;   font-size: 28px; }
    .deco:nth-child(2)  { top: 12%; right: 5%;  animation-delay: 1s;   font-size: 18px; }
    .deco:nth-child(3)  { top: 40%; left: 1%;   animation-delay: 2s;   font-size: 24px; }
    .deco:nth-child(4)  { top: 70%; right: 3%;  animation-delay: 0.5s; font-size: 20px; }
    .deco:nth-child(5)  { top: 85%; left: 5%;   animation-delay: 1.5s; font-size: 26px; }
    .deco:nth-child(6)  { top: 22%; left: 8%;   animation-delay: 3s;   font-size: 16px; }
    .deco:nth-child(7)  { top: 55%; right: 6%;  animation-delay: 2.5s; font-size: 20px; }
    .deco:nth-child(8)  { top: 90%; right: 8%;  animation-delay: 1s;   font-size: 18px; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%       { transform: translateY(-10px) rotate(5deg); }
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 36px;
    }
    .header .jp-title {
      font-family: 'Noto Serif JP', serif;
      font-size: 12px; font-weight: 300;
      color: #8a9a7a; letter-spacing: 5px; margin-bottom: 6px;
    }
    .header h1 {
      font-family: 'Noto Serif JP', serif;
      font-size: 30px; font-weight: 300;
      color: #4a5440; letter-spacing: 2px;
    }
    .header .divider {
      width: 40px; height: 1px;
      background: #b0ba98; margin: 12px auto 0;
    }

    /* Two column layout */
    .layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 24px;
      align-items: start;
    }

    /* LEFT PANEL */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: #fdfaf4;
      border: 1px solid #ddd8c8;
      border-radius: 18px;
      padding: 20px;
    }

    .card-label {
      font-size: 10px; letter-spacing: 3px;
      text-transform: uppercase; color: #8a9a7a;
      margin-bottom: 12px;
    }

    .task-input {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #ddd8c8;
      border-radius: 30px;
      background: #f5f0e8;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: #4a5440;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 12px;
    }
    .task-input::placeholder { color: #b0b89a; }
    .task-input:focus {
      border-color: #8a9a7a;
      box-shadow: 0 0 0 3px rgba(138,154,122,0.12);
    }

    .priority-row {
      display: flex; gap: 8px; margin-bottom: 12px;
    }
    .priority-btn {
      flex: 1; padding: 7px 0;
      border-radius: 20px;
      border: 1.5px solid transparent;
      font-size: 12px; cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s; background: transparent;
      text-align: center;
    }
    .priority-btn.high   { border-color: #d4a898; color: #a06050; }
    .priority-btn.medium { border-color: #c8b870; color: #807030; }
    .priority-btn.low    { border-color: #8ab080; color: #406040; }
    .priority-btn.high.active   { background: #f5e8e4; border-color: #a06050; font-weight: 500; }
    .priority-btn.medium.active { background: #f5f0d0; border-color: #807030; font-weight: 500; }
    .priority-btn.low.active    { background: #e4f0e0; border-color: #406040; font-weight: 500; }

    .date-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 14px;
    }
    .date-row label { font-size: 12px; color: #8a9a7a; white-space: nowrap; }
    .date-row input[type="date"] {
      flex: 1; padding: 8px 12px;
      border: 1px solid #ddd8c8;
      border-radius: 20px;
      background: #f5f0e8;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      color: #4a5440; outline: none;
    }

    .add-btn {
      width: 100%; padding: 11px;
      border-radius: 30px; border: none;
      background: #7a9068;
      color: white; font-size: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500; cursor: pointer;
      letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.1s;
    }
    .add-btn:hover { background: #688058; transform: translateY(-1px); }
    .add-btn:active { transform: translateY(0); }

    /* Stats card */
    .stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; text-align: center;
    }
    .stat-item { padding: 10px 0; }
    .stat-num {
      font-size: 22px; font-weight: 300;
      color: #4a5440; font-family: 'Noto Serif JP', serif;
      line-height: 1;
    }
    .stat-lbl {
      font-size: 10px; color: #8a9a7a;
      letter-spacing: 1px; margin-top: 4px;
    }

    /* RIGHT PANEL */
    .right-panel {}

    .right-top {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 14px; flex-wrap: wrap; gap: 8px;
    }

    /* Breadcrumb filters */
    .breadcrumbs {
      display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
    }
    .breadcrumb-sep { color: #b0b89a; font-size: 12px; }
    .breadcrumb-btn {
      padding: 4px 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      font-size: 12px; cursor: pointer;
      font-family: 'Inter', sans-serif;
      color: #8a9a7a; background: transparent;
      transition: all 0.15s;
    }
    .breadcrumb-btn:hover { background: #edeae0; }
    .breadcrumb-btn.active {
      background: #7a9068; color: white;
      border-color: #7a9068;
    }

    .task-count {
      font-size: 12px; color: #b0b89a;
    }

    /* Task list */
    .task-list { list-style: none; }

    .task-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px;
      background: #fdfaf4;
      border: 1px solid #ddd8c8;
      border-left: 3px solid transparent;
      border-radius: 14px;
      margin-bottom: 8px;
      animation: fadeIn 0.22s ease;
      transition: opacity 0.3s;
    }
    .task-item.done { opacity: 0.4; }
    .task-item.p-high   { border-left-color: #c88878; }
    .task-item.p-medium { border-left-color: #c8b060; }
    .task-item.p-low    { border-left-color: #78a878; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-checkbox {
      width: 18px; height: 18px; min-width: 18px;
      border-radius: 50%;
      border: 1.5px solid #8a9a7a;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; margin-top: 2px;
    }
    .task-item.done .task-checkbox {
      background: #7a9068; border-color: #7a9068;
    }
    .task-checkbox::after {
      content: '';
      width: 4px; height: 8px;
      border-right: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(45deg) translate(-1px, -1px);
      display: none;
    }
    .task-item.done .task-checkbox::after { display: block; }

    .task-body { flex: 1; }
    .task-text {
      font-size: 14px; color: #4a5440;
      font-weight: 300; line-height: 1.5;
    }
    .task-item.done .task-text { text-decoration: line-through; color: #a0a890; }

    .task-meta {
      display: flex; gap: 6px; margin-top: 5px;
      align-items: center; flex-wrap: wrap;
    }
    .badge {
      font-size: 10px; padding: 2px 8px;
      border-radius: 10px; letter-spacing: 0.3px;
    }
    .badge.high   { background: #f5e8e4; color: #a06050; }
    .badge.medium { background: #f5f0d0; color: #807030; }
    .badge.low    { background: #e4f0e0; color: #406040; }
    .badge.date   { background: #edeae0; color: #7a8a6a; }
    .badge.overdue { background: #fde8e0; color: #c06040; }

    .task-delete {
      background: none; border: none;
      cursor: pointer; color: #c8c0b0;
      font-size: 14px; padding: 2px 4px;
      border-radius: 6px; transition: color 0.2s;
      margin-top: 1px; line-height: 1;
    }
    .task-delete:hover { color: #a06050; }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: #c0c8b0;
      font-size: 13px;
      letter-spacing: 1px;
      font-family: 'Noto Serif JP', serif;
      font-weight: 300;
    }

    .footer {
      text-align: center; font-size: 11px;
      color: #a0aa88; letter-spacing: 2px; margin-top: 32px;
    }

    @media (max-width: 700px) {
      .layout { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Floating deco -->
  <span class="deco">🌿</span>
  <span class="deco">✦</span>
  <span class="deco">🍵</span>
  <span class="deco">❋</span>
  <span class="deco">🌾</span>
  <span class="deco">◈</span>
  <span class="deco">🪴</span>
  <span class="deco">✿</span>

  <div class="page">
    <div class="header">
      <p class="jp-title">やること</p>
      <h1>To Do</h1>
      <div class="divider"></div>
    </div>

    <div class="layout">
      <!-- LEFT -->
      <div class="left-panel">
        <div class="card">
          <p class="card-label">New Task</p>
          <input type="text" class="task-input" id="taskInput" placeholder="What needs to be done?" maxlength="100"/>

          <p class="card-label">Priority</p>
          <div class="priority-row">
            <button class="priority-btn high"   id="btn-high"   onclick="selectPriority('high')">↑ High</button>
            <button class="priority-btn medium" id="btn-medium" onclick="selectPriority('medium')">· Med</button>
            <button class="priority-btn low"    id="btn-low"    onclick="selectPriority('low')">↓ Low</button>
          </div>

          <div class="date-row">
            <label>Due date</label>
            <input type="date" id="dueDateInput"/>
          </div>

          <button class="add-btn" onclick="addTask()">+ Add Task</button>
        </div>

        <div class="card">
          <p class="card-label">Overview</p>
          <div class="stats">
            <div class="stat-item">
              <div class="stat-num" id="stat-total">0</div>
              <div class="stat-lbl">Total</div>
            </div>
            <div class="stat-item">
              <div class="stat-num" id="stat-done">0</div>
              <div class="stat-lbl">Done</div>
            </div>
            <div class="stat-item">
              <div class="stat-num" id="stat-left">0</div>
              <div class="stat-lbl">Left</div>
            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right-panel">
        <div class="right-top">
          <div class="breadcrumbs">
            <button class="breadcrumb-btn active" onclick="setFilter('all', this)">All</button>
            <span class="breadcrumb-sep">›</span>
            <button class="breadcrumb-btn" onclick="setFilter('active', this)">Active</button>
            <span class="breadcrumb-sep">›</span>
            <button class="breadcrumb-btn" onclick="setFilter('done', this)">Done</button>
            <span class="breadcrumb-sep">›</span>
            <button class="breadcrumb-btn" onclick="setFilter('high', this)">↑ High</button>
            <span class="breadcrumb-sep">›</span>
            <button class="breadcrumb-btn" onclick="setFilter('overdue', this)">Overdue</button>
          </div>
          <span class="task-count" id="taskCount"></span>
        </div>

        <ul class="task-list" id="taskList"></ul>
      </div>
    </div>

    <div class="footer">一歩一歩 · one step at a time</div>
  </div>

<script>
  let tasks = JSON.parse(localStorage.getItem('jp-tasks-v2') || '[]');
  let selectedPriority = 'medium';
  let currentFilter = 'all';

  function save() { localStorage.setItem('jp-tasks-v2', JSON.stringify(tasks)); }

  function selectPriority(p) {
    selectedPriority = p;
    ['high','medium','low'].forEach(x =>
      document.getElementById('btn-' + x).classList.toggle('active', x === p)
    );
  }
  selectPriority('medium');

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.breadcrumb-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function isOverdue(t) {
    if (!t.dueDate || t.done) return false;
    return new Date(t.dueDate) < new Date(new Date().toDateString());
  }

  function formatDate(d) {
    if (!d) return '';
    return new Date(d + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function updateStats() {
    const total = tasks.length;
    const done  = tasks.filter(t => t.done).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-done').textContent  = done;
    document.getElementById('stat-left').textContent  = total - done;
  }

  function render() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';

    let filtered = tasks.map((t, i) => ({ ...t, _idx: i })).filter(t => {
      if (currentFilter === 'active')  return !t.done;
      if (currentFilter === 'done')    return t.done;
      if (currentFilter === 'high')    return t.priority === 'high';
      if (currentFilter === 'overdue') return isOverdue(t);
      return true;
    });

    document.getElementById('taskCount').textContent =
      filtered.length ? filtered.length + ' task' + (filtered.length > 1 ? 's' : '') : '';

    if (filtered.length === 0) {
      list.innerHTML = `<div class="empty-state">— nothing here —</div>`;
      return;
    }

    const priorityLabel = { high: '↑ High', medium: '· Med', low: '↓ Low' };

    filtered.forEach(task => {
      const i = task._idx;
      const overdue = isOverdue(task);
      const li = document.createElement('li');
      li.className = ['task-item', task.done ? 'done' : '', 'p-' + (task.priority || 'medium')].join(' ').trim();

      const pBadge = task.priority
        ? `<span class="badge ${task.priority}">${priorityLabel[task.priority]}</span>` : '';
      const dBadge = task.dueDate
        ? `<span class="badge ${overdue ? 'overdue' : 'date'}">🗓 ${formatDate(task.dueDate)}${overdue ? ' · overdue' : ''}</span>` : '';

      li.innerHTML = `
        <div class="task-checkbox" onclick="toggleTask(${i})"></div>
        <div class="task-body">
          <div class="task-text">${escapeHtml(task.text)}</div>
          ${pBadge || dBadge ? `<div class="task-meta">${pBadge}${dBadge}</div>` : ''}
        </div>
        <button class="task-delete" onclick="deleteTask(${i})">✕</button>
      `;
      list.appendChild(li);
    });

    updateStats();
  }

  function addTask() {
    const input = document.getElementById('taskInput');
    const text = input.value.trim();
    if (!text) return;
    const dueDate = document.getElementById('dueDateInput').value;
    tasks.unshift({ text, done: false, priority: selectedPriority, dueDate: dueDate || '' });
    save(); render();
    input.value = '';
    document.getElementById('dueDateInput').value = '';
    input.focus();
  }

  function toggleTask(i) { tasks[i].done = !tasks[i].done; save(); render(); }
  function deleteTask(i) { tasks.splice(i, 1); save(); render(); }

  document.getElementById('taskInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  render();
  updateStats();
</script>
</body>
</html>
